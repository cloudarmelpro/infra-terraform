name: iac
on: [pull_request]
permissions:
  contents: read
  id-token: write
  pull-requests: write   # publication du plan en commentaire
jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkov
        run: |
          pipx install checkov
          checkov -d . --framework terraform --compact --download-external-modules true --soft-fail      # Checkov informe ; Conftest bloque

  conftest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dossier: [socle, envs/dev/aws]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_READONLY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Plan
        working-directory: ${{ matrix.dossier }}
        run: |
          terraform init -input=false
          terraform plan -lock=false -input=false -out=tfplan
          terraform show -json tfplan > plan.json
          terraform show -no-color tfplan > plan.txt

      - name: Plan en commentaire de la pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Plan Terraform : \`${{ matrix.dossier }}\`"
            echo
            echo "$(grep -E '^Plan:|^No changes' ${{ matrix.dossier }}/plan.txt || echo 'Voir le journal du job')"
            echo
            echo '<details><summary>Détail du plan</summary>'
            echo
            echo '```'
            tail -c 60000 ${{ matrix.dossier }}/plan.txt
            echo '```'
            echo '</details>'
          } > commentaire.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file commentaire.md
      - name: Conftest (dernière version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(gh release view -R open-policy-agent/conftest --json tagName -q .tagName)
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/${VERSION}/conftest_${VERSION#v}_Linux_x86_64.tar.gz" | tar xz conftest
          ./conftest test ${{ matrix.dossier }}/plan.json --policy policies/
