name: arreter
# Détruit l'environnement (le socle et les IP fixes sont conservés).
# Le NLB, créé par Kubernetes et non par Terraform, est supprimé d'abord : sinon le VPC ne peut pas être détruit.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  arreter:
    runs-on: ubuntu-latest
    environment: infra
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 7200
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Le cluster existe-t-il ?
        id: env
        run: |
          if aws eks describe-cluster --name gitops-dev >/dev/null 2>&1; then echo "actif=true" >> "$GITHUB_OUTPUT"; else echo "actif=false" >> "$GITHUB_OUTPUT"; fi
          echo "CIDR_CI=[\"$(curl -s https://checkip.amazonaws.com | tr -d '[:space:]')/32\"]" >> "$GITHUB_ENV"

      - name: Accès temporaire du runner à l'API
        if: steps.env.outputs.actif == 'true'
        working-directory: envs/dev/aws
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false -var "acces_ci_cidrs=$CIDR_CI"

      - name: Supprimer le NLB (ArgoCD arrêté pour qu'il ne le recrée pas)
        if: steps.env.outputs.actif == 'true'
        run: |
          aws eks update-kubeconfig --name gitops-dev --region us-east-1
          kubectl -n argocd scale statefulset argocd-application-controller --replicas=0 || true
          kubectl -n traefik delete svc traefik --ignore-not-found --wait=true --timeout=300s
          for i in $(seq 1 40); do
            [ -z "$(aws elbv2 describe-load-balancers --query "LoadBalancers[?contains(LoadBalancerName,'traefik')].LoadBalancerArn" --output text)" ] && break
            sleep 15
          done

      - name: ArgoCD
        if: steps.env.outputs.actif == 'true'
        working-directory: envs/dev/platform
        run: |
          terraform init -input=false
          terraform destroy -auto-approve -input=false

      - name: Réseau et cluster
        if: steps.env.outputs.actif == 'true'
        working-directory: envs/dev/aws
        run: terraform destroy -auto-approve -input=false -var "acces_ci_cidrs=$CIDR_CI"
