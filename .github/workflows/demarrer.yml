name: demarrer
# Recrée tout l'environnement : réseau, cluster, ArgoCD, puis la plateforme depuis gitops-config (25 à 30 minutes).
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  demarrer:
    runs-on: ubuntu-latest
    environment: infra
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cloudarmelpro/gitops-config
          path: gitops-config
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: eu-west-3
          role-duration-seconds: 7200
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Adresse du runner (accès temporaire à l'API du cluster)
        run: |
          echo "DEBUT=$(date +%s)" >> "$GITHUB_ENV"
          echo "CIDR_CI=[\"$(curl -s https://checkip.amazonaws.com | tr -d '[:space:]')/32\"]" >> "$GITHUB_ENV"

      - name: Réseau et cluster
        working-directory: envs/dev/aws
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false -var "acces_ci_cidrs=$CIDR_CI"

      - name: ArgoCD (sans métriques, Prometheus n'existe pas encore)
        working-directory: envs/dev/platform
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false -var activer_metriques=false

      - name: Application racine
        run: |
          aws eks update-kubeconfig --name gitops-dev --region eu-west-3
          kubectl apply -f gitops-config/bootstrap/root.yaml

      - name: Métriques d'ArgoCD (si la supervision est activée dans Git)
        working-directory: envs/dev/platform
        run: |
          if [ -f metriques.auto.tfvars ]; then
            timeout 1200 bash -c 'until kubectl get crd servicemonitors.monitoring.coreos.com >/dev/null 2>&1; do sleep 15; done'
            terraform apply -auto-approve -input=false
          fi

      - name: Fermer l'accès temporaire du runner
        if: always()
        working-directory: envs/dev/aws
        run: terraform apply -auto-approve -input=false

      - name: Bilan
        if: success()
        run: |
          FIN=$(date +%s)
          echo "Environnement prêt en $(( (FIN - DEBUT) / 60 )) min $(( (FIN - DEBUT) % 60 )) s." | tee -a "$GITHUB_STEP_SUMMARY"
